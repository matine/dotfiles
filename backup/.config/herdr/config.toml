onboarding = false

[keys]
# Backtick has no ASCII control code, so this relies on the Kitty keyboard
# protocol. Ghostty enables it by default; WezTerm 20240203 does not.
prefix = "ctrl+`"
# Herdr's own keybinding overlay, the fastest way to look a chord up in situ.
help = "prefix+?"

previous_tab = ["prefix+t+h"]
next_tab = ["prefix+t+l"]
new_tab = ["prefix+t+n"]
split_vertical = ["prefix+v"]
split_horizontal = ["prefix+h"]
close_tab = ["prefix+t+x"]
zoom = ["prefix+z"]
# Modified Tab has no legacy terminal encoding and isn't documented as safe in
# custom bindings, so this one keeps a direct chord and spells it with a letter.
# Herdr's vetted prefix-free set: https://herdr.dev/docs/keyboard/
cycle_pane_next = ["prefix+p+l", "ctrl+alt+p+l"]
cycle_pane_previous = ["prefix+p+h"]
close_pane = ["prefix+p+x"]
# Up and down keys move between workspaces.
workspace_picker = "prefix+w"
# prefix+N, since plain prefix+n is the next tab.
new_workspace = "prefix+w+n"
close_workspace = "prefix+w+x"

[ui]
agent_panel_sort = "priority"

show_agent_labels_on_pane_borders = true
[ui.toast]
delivery = "system"

